// ---- Sparkline ----
const Sparkline = ({ data, color = 'var(--accent)', height = 24, width = 120, fill }) => {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const points = data.map((v, i) => [i*step, height - ((v-min)/range)*height]);
  const path = points.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fillPath = path + ` L ${width} ${height} L 0 ${height} Z`;
  return (
    <svg width={width} height={height} style={{ display:'block' }}>
      {fill && <path d={fillPath} fill={fill}/>}
      <path d={path} stroke={color} strokeWidth={1.5} fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

// ---- SeverityBar ----
const SeverityBar = ({ counts, height = 6, width = 140 }) => {
  const order = ['critical','high','medium','low','info'];
  const total = order.reduce((a,k) => a + (counts[k[0]==='c'?'crit':k.slice(0,3)]||0), 0);
  const segs = order.map(k => {
    const key = k === 'critical' ? 'crit' : k.slice(0,3);
    return { key:k, val: counts[key]||0 };
  }).filter(s => s.val > 0);
  if (total === 0) return <div style={{ height, width, background:'var(--bg-3)', borderRadius:2 }}/>;
  return (
    <div style={{ display:'flex', width, height, borderRadius:2, overflow:'hidden', background:'var(--bg-3)' }}>
      {segs.map((s,i) => (
        <div key={s.key} style={{
          width: `${(s.val/total)*100}%`,
          background: sevMeta[s.key].color,
          borderRight: i < segs.length-1 ? '1px solid var(--bg-1)' : 'none',
        }}/>
      ))}
    </div>
  );
};

// ---- Topbar ----
const Topbar = ({ title, breadcrumbs, right, tabs, activeTab, onTab, onToggleRail, railOpen }) => {
  return (
    <div style={{
      height:46, flexShrink:0,
      background:'var(--bg)',
      borderBottom:'1px solid var(--line)',
      display:'flex', alignItems:'center',
      padding:'0 18px',
      gap:14,
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, flex:1, minWidth:0 }}>
        {breadcrumbs && breadcrumbs.map((b, i) => (
          <React.Fragment key={i}>
            {i > 0 && <span style={{ color:'var(--text-4)' }}>/</span>}
            <span style={{ color: i === breadcrumbs.length-1 ? 'var(--text)' : 'var(--text-3)', fontSize:13, fontWeight: i === breadcrumbs.length-1 ? 500 : 400 }}>
              {b}
            </span>
          </React.Fragment>
        ))}
        {!breadcrumbs && title && <span style={{ fontSize:14, fontWeight:500 }}>{title}</span>}

        {tabs && (
          <div style={{ display:'flex', gap:2, marginLeft:18 }}>
            {tabs.map(t => (
              <button key={t.id} onClick={() => onTab(t.id)} style={{
                padding:'6px 10px', fontSize:12.5,
                color: activeTab === t.id ? 'var(--text)' : 'var(--text-3)',
                position:'relative',
                borderRadius:4,
              }}>
                {t.label}
                {t.count != null && <span style={{ marginLeft:6, color:'var(--text-4)', fontFamily:'var(--mono)', fontSize:11 }}>{t.count}</span>}
                {activeTab === t.id && <div style={{ position:'absolute', left:8, right:8, bottom:-11, height:1.5, background:'var(--accent)' }}/>}
              </button>
            ))}
          </div>
        )}
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        {right}
        <IconButton icon={<Ic name="bell" size={15}/>} title="Notifications"/>
        <IconButton
          icon={<Ic name={railOpen ? 'close' : 'activity'} size={15}/>}
          title="Activity rail"
          active={railOpen}
          onClick={onToggleRail}/>
      </div>
    </div>
  );
};

const Dashboard = ({ engagement, onNav }) => {

  const sparkC = [0,0,1,1,2,2,2,2,2,2,2,2];
  const sparkTargets = [2,5,8,10,12,12,13,14,14,14,14,14];

  return (
    <div style={{ padding:'22px 24px', maxWidth:1400 }}>
      {/* Header with engagement meta */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20, gap:20 }}>
        <div style={{ flex:1 }}>

              {engagement.code} · {engagement.phase}

          </div>
          <div style={{ fontSize:24, fontWeight:600, letterSpacing:'-0.025em', marginBottom:8 }}>{engagement.name}</div>
          <div style={{ display:'flex', alignItems:'center', gap:16, color:'var(--text-3)', fontSize:12.5 }}>
            <span style={{ display:'flex', alignItems:'center', gap:6 }}><Ic name="calendar" size={13}/> {engagement.start} → {engagement.end}</span>
            <span style={{ display:'flex', alignItems:'center', gap:6 }}><Ic name="target" size={13}/> {engagement.targets} targets</span>
            <span style={{ display:'flex', alignItems:'center', gap:6 }}><Ic name="users" size={13}/> <AvatarStack ids={engagement.team} size={18}/></span>
            <span style={{ display:'flex', alignItems:'center', gap:6 }}><Ic name="shield" size={13}/> <span style={{ fontFamily:'var(--mono)' }}>{engagement.type}</span></span>
          </div>
        </div>
        <div style={{ display:'flex', gap:6 }}>
          <Button variant="ghost" icon={<Ic name="download" size={14}/>}>Export</Button>
          <Button variant="secondary" icon={<Ic name="play" size={13}/>}>Run scan</Button>
          <Button variant="primary" icon={<Ic name="plus" size={14}/>}>New finding</Button>
        </div>
      </div>

      {/* Progress bar with phase markers */}
      <Card padding={16} style={{ marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <div style={{ fontSize:12.5, fontWeight:500 }}>Engagement progress</div>
          <div style={{ fontSize:12, color:'var(--text-3)', fontFamily:'var(--mono)' }}>{Math.round(engagement.progress*100)}% · 7 days remaining</div>
        </div>
        <div style={{ position:'relative', height:24 }}>
          <div style={{ position:'absolute', inset:'10px 0', height:4, background:'var(--bg-3)', borderRadius:999 }}/>
          <div style={{ position:'absolute', left:0, top:10, height:4, width:`${engagement.progress*100}%`, background:'linear-gradient(90deg, var(--accent) 0%, #ffcc55 100%)', borderRadius:999 }}/>
          {['Scoping','Recon','Discovery','Exploitation','Reporting','Review'].map((p, i, arr) => {
            const pct = i/(arr.length-1);
            const passed = pct <= engagement.progress;
            const current = p === engagement.phase;
            return (
              <div key={p} style={{
                position:'absolute', left:`${pct*100}%`, top:0, transform:'translateX(-50%)',
                display:'flex', flexDirection:'column', alignItems:'center', gap:3,
              }}>
                <div style={{
                  width: current ? 12 : 8, height: current ? 12 : 8, borderRadius:999,
                  marginTop: current ? 6 : 8,
                  background: current ? 'var(--accent)' : passed ? '#ffcc55' : 'var(--bg-3)',
                  border: current ? '2px solid var(--bg)' : passed ? 'none' : '1px solid var(--line-2)',
                  boxShadow: current ? '0 0 0 3px rgba(255,170,0,0.2)' : 'none',
                }}/>
              </div>
            );
          })}
        </div>

            <span key={p} style={{
              width:'16.6%', textAlign:'center',
              color: p === engagement.phase ? 'var(--accent)' : undefined,

      </Card>

      {/* KPIs */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:14, marginBottom:20 }}>
        <KPI

          icon={<Ic name="bug" size={14}/>}
        />
        <KPI
          label="Critical · unresolved"
          value={criticalOpen}
          color="var(--crit)"
          delta="+1"
          deltaLabel="one new in last 24h"
          spark={<Sparkline data={sparkC} color="var(--crit)" fill="rgba(255,74,94,0.15)" width={200} height={30}/>}
          icon={<Ic name="zap" size={14}/>}

        <KPI
          label="Targets in scope"
          value={engagement.targets}

          icon={<Ic name="target" size={14}/>}
        />
        <KPI
          label="Mean time to triage"
          value="2.4h"
          delta="-18%"
          deltaLabel="faster than avg"
          spark={<Sparkline data={[6,5.2,4.8,4.9,4.1,3.6,3.8,3.2,2.9,2.6,2.5,2.4]} color="var(--ok)" fill="rgba(52,211,153,0.12)" width={200} height={30}/>}
          icon={<Ic name="clock" size={14}/>}
        />
      </div>

      {/* Grid: severity breakdown + activity + risk chart */}

            {['critical','high','medium','low','info'].map(sev => {

            </div>
            <Button variant="ghost" size="sm" iconRight={<Ic name="chevRight" size={12}/>} onClick={()=>onNav('findings')}>View all</Button>
          </div>

          right={
            <div style={{ display:'flex', gap:6 }}>

          {engagements.map(e => <EngagementCard key={e.id} engagement={e}/>)}
        </div>
      </div>
    </div>
  );
};

function distributeCounts(total) {
  const c = Math.min(1, Math.floor(total * 0.15));
  const h = Math.floor(total * 0.3);
  const m = Math.floor(total * 0.35);
  const l = total - c - h - m;
  return { crit:c, hig:h, med:m, low:Math.max(0,l), inf:0 };
}

// ===== src/app.jsx =====
// ============ App ============

const { useState, useEffect } = React;

function App() {
  const [current, setCurrent] = useState(() => localStorage.getItem('drift.nav') || 'dashboard');
  const [engagementId, setEngagementId] = useState('eng-acme-web');
  const [railOpen, setRailOpen] = useState(true);
  const [tweaks, setTweaks] = useState(window.__TWEAKS__);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => { localStorage.setItem('drift.nav', current); }, [current]);

  const engagement = engagements.find(e => e.id === engagementId);

  // Tweak mode
  useEffect(() => {
    const handler = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e?.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ [k]: v } }, '*');
  };

  // Apply accent hue
  useEffect(() => {
    const h = tweaks.accentHue;
    document.documentElement.style.setProperty('--accent', `oklch(0.78 0.165 ${h})`);
    document.documentElement.style.setProperty('--accent-bg', `oklch(0.78 0.165 ${h} / 0.10)`);
    document.documentElement.style.setProperty('--accent-line', `oklch(0.78 0.165 ${h} / 0.30)`);
  }, [tweaks.accentHue]);

  const railVisible = railOpen && tweaks.showActivityRail;

  const screen = (() => {
    switch (current) {
      case 'dashboard': return <Dashboard engagement={engagement} onNav={setCurrent}/>;
      case 'targets':   return <Targets engagement={engagement}/>;
      case 'findings':  return <Findings engagement={engagement}/>;
      case 'report':    return <Report engagement={engagement}/>;
      case 'vault':     return <Vault engagement={engagement}/>;
      case 'settings':  return <Settings onNav={setCurrent}/>;
      case 'integrations': return <Settings onNav={setCurrent}/>;
      default:          return <Dashboard engagement={engagement} onNav={setCurrent}/>;
    }
  })();

  const screenTitle = {
    dashboard:'Dashboard', targets:'Targets', findings:'Findings', report:'Report',
    vault:'Vault', settings:'Settings', integrations:'Integrations',
  }[current] || 'Dashboard';

  const topbarRight = current === 'dashboard' ? null : (
    <Button variant="ghost" size="sm" icon={<Ic name="filter" size={13}/>}>Filter</Button>
  );

  return (
    <div data-screen-label="Pentest Suite" style={{ display:'flex', minHeight:'100vh' }}>
      <Sidebar
        current={current}
        onNav={setCurrent}
        currentEngagement={engagement}
        onOpenEngagements={() => {
          const next = engagements[(engagements.findIndex(e=>e.id===engagementId)+1) % engagements.length].id;
          setEngagementId(next);
        }}
      />

      <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
        <Topbar
          breadcrumbs={[engagement.client, screenTitle]}
          right={topbarRight}
          railOpen={railVisible}
          onToggleRail={() => setRailOpen(!railOpen)}
        />
        <div style={{ flex:1, minWidth:0, overflow:'auto' }}>
          {screen}
        </div>
      </div>

      {railVisible && <ActivityRail onClose={() => setRailOpen(false)}/>}

      {tweaksOpen && <Tweaks tweaks={tweaks} setTweak={setTweak} onClose={()=>setTweaksOpen(false)}/>}
    </div>
  );
}

styleTag.textContent = `
  .hoverRow { transition: background 0.1s; }
  .hoverRow:hover { background: var(--bg-2) !important; }

  .hoverCard:hover { border-color: var(--line-2); }
`;
document.head.appendChild(styleTag);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
