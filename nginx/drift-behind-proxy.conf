# Drift — behind reverse proxy (HTTP only)
# Upstream proxy terminates TLS and forwards to this nginx over HTTP.
# Set_real_ip_from covers RFC-1918 ranges; tighten to your proxy's IP if known.

server {
    listen 80;
    server_name _;

    # ── Real IP passthrough ─────────────────────────────────────────────────────
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;

    # ── Security headers ────────────────────────────────────────────────────────
    # HSTS is the upstream proxy's responsibility — omit here to avoid conflicts.
    add_header X-Frame-Options          DENY                             always;
    add_header X-Content-Type-Options   nosniff                          always;
    add_header X-XSS-Protection         "1; mode=block"                  always;
    add_header Referrer-Policy          strict-origin-when-cross-origin  always;

    # ── Static frontend ─────────────────────────────────────────────────────────
    root  /var/www/drift;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ───────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Preserve the upstream protocol so the API can apply HTTPS-only logic
        proxy_set_header   X-Forwarded-Proto  $http_x_forwarded_proto;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Stricter rate limit on auth endpoint
    location /api/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $http_x_forwarded_proto;
    }

    # ── Upload size ─────────────────────────────────────────────────────────────
    client_max_body_size 55M;

    # ── Gzip ────────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml;

    # ── Cache static assets ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|svg)$ {
        expires   30d;
        add_header Cache-Control "public, immutable";
    }
}
