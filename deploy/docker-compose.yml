version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drift
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?err} --loglevel warning --save 60 1
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-drift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://drift:${POSTGRES_PASSWORD}@db:5432/drift
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
    volumes:
      - artifacts:/var/drift/uploads
      - auditlogs:/var/drift/audit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    security_opt:
      - no-new-privileges:true
    read_only: false

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - artifacts:/var/drift/uploads
      - toolswork:/work
    networks:
      - internal
      - external
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW       # Required for nmap/masscan raw sockets
      - NET_ADMIN      # Required for nmap OS detection
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  artifacts:
  auditlogs:
  toolswork:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
