apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drift.fullname" . }}-config
  labels:
    {{- include "drift.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  OPEN_REGISTRATION: {{ .Values.config.openRegistration | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  ALLOW_RFC1918: {{ .Values.config.allowRfc1918 | quote }}
  ENABLE_CLOUD_MODULES: {{ .Values.config.enableCloudModules | quote }}
  AUDIT_LOG_PATH: {{ .Values.config.auditLogPath | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.config.auditRetentionDays | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  DATABASE_URL: {{ include "drift.databaseUrl" . | quote }}
  REDIS_URL: {{ include "drift.redisUrl" . | quote }}
  MINIO_ENDPOINT: {{ include "drift.minioEndpoint" . | quote }}
  MINIO_ACCESS_KEY: "drift"
  MINIO_BUCKET: "drift-artifacts"
  MINIO_USE_SSL: "false"
