apiVersion: v2
name: drift
description: Open-source automated penetration testing platform
type: application
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - penetration-testing
  - security
  - pentest
  - vulnerability-scanning

home: https://github.com/dalt0n0/drift

sources:
  - https://github.com/dalt0n0/drift

maintainers:
  - name: dalt0n0
    url: https://github.com/dalt0n0

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled

annotations:
  category: Security
