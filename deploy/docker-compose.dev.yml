version: "3.9"

# Development overrides: enables docs, debug mode, hot reload
services:
  api:
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      OPEN_REGISTRATION: "true"
    volumes:
      - ../backend:/app:cached
